<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Yodha — Telugu Voice AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;background:#eceae4;color:#2d3a1e}
body{display:flex;align-items:center;justify-content:center;min-height:100%}

.screen{
  display:none;width:100%;max-width:480px;min-height:100dvh;
  flex-direction:column;align-items:center;
  background:#eceae4;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}
.screen.active{display:flex}

/* ── HOME ── */
#home{justify-content:flex-start;padding-left:28px;padding-right:28px}

.home-greeting{
  width:100%;
  padding-top:max(64px,env(safe-area-inset-top,64px));
  padding-bottom:8px;
  font-size:13px;font-weight:500;color:#7a8c6a;
  letter-spacing:.3px;text-transform:uppercase;
}
.home-title{
  width:100%;margin-bottom:32px;
  font-size:30px;font-weight:600;color:#2d3a1e;letter-spacing:-.5px;line-height:1.2;
}

.call-card{
  width:100%;border-radius:22px;overflow:hidden;cursor:pointer;
  background:#8aaa6a;
  padding:48px 28px;
  display:flex;flex-direction:column;align-items:flex-start;
  gap:20px;
  transition:transform .18s ease,box-shadow .18s ease;
}
.call-card:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(90,120,60,.2)}
.call-card:active{transform:translateY(0) scale(.98)}

.card-phone{
  width:44px;height:44px;background:rgba(255,255,255,.25);border-radius:12px;
  display:flex;align-items:center;justify-content:center;
}
.card-phone svg{width:22px;height:22px;color:#fff}
.card-name{font-size:28px;font-weight:600;color:#fff;letter-spacing:-.4px}
.card-hint{font-size:14px;font-weight:400;color:rgba(255,255,255,.75)}

.disclaimer{
  width:100%;margin-top:20px;
  font-size:12px;color:#9aaa8a;line-height:1.6;
}

/* ── CALL ── */
#call{justify-content:flex-start;padding-left:24px;padding-right:24px}

.call-header{
  width:100%;
  padding-top:max(52px,env(safe-area-inset-top,52px));
  padding-bottom:24px;
  display:flex;align-items:center;justify-content:space-between;
}
.call-title{font-size:17px;font-weight:600;color:#2d3a1e}
.call-timer{
  font-size:15px;font-weight:400;color:#7a8c6a;
  font-variant-numeric:tabular-nums;letter-spacing:.5px;
}

.orb-wrap{
  flex:1;display:flex;align-items:center;justify-content:center;width:100%;
}
.orb{
  width:180px;height:180px;border-radius:50%;
  background:#8aaa6a;
  transition:border-radius .4s ease,background .4s ease;
}
.orb.idle{animation:orbFloat 5s ease-in-out infinite}
.orb.listening{
  animation:orbListen 1.5s ease-in-out infinite;
  background:#7a9c5a;
}
.orb.speaking{
  animation:orbSpeak .85s ease-in-out infinite;
  background:#6e8f50;
}
.orb.thinking{
  animation:orbThink 2.4s ease-in-out infinite;
  background:#8aaa6a;opacity:.75;
}

@keyframes orbFloat{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-10px) scale(1.015)}
}
@keyframes orbListen{
  0%{transform:scale(1);border-radius:50%}
  25%{transform:scale(1.06);border-radius:52% 48% 54% 46%/46% 54% 46% 54%}
  50%{transform:scale(1.10);border-radius:50%}
  75%{transform:scale(1.06);border-radius:47% 53% 46% 54%/54% 46% 54% 46%}
  100%{transform:scale(1);border-radius:50%}
}
@keyframes orbSpeak{
  0%{transform:scale(1);border-radius:50%}
  20%{transform:scale(1.10);border-radius:54% 46% 58% 42%/42% 58% 42% 58%}
  40%{transform:scale(1.06);border-radius:47% 53% 44% 56%/56% 44% 56% 44%}
  60%{transform:scale(1.12);border-radius:52% 48% 53% 47%/47% 53% 47% 53%}
  80%{transform:scale(1.08);border-radius:50% 50% 47% 53%/53% 47% 53% 47%}
  100%{transform:scale(1);border-radius:50%}
}
@keyframes orbThink{
  0%,100%{transform:scale(.96) translateY(0)}
  50%{transform:scale(1.02) translateY(-5px)}
}

.call-status{
  font-size:14px;font-weight:400;color:#7a8c6a;
  margin-top:20px;margin-bottom:8px;
  min-height:20px;
}

.transcript-peek{
  width:100%;max-width:340px;
  font-size:13px;color:#5a6e4a;line-height:1.6;
  min-height:40px;text-align:center;
  max-height:60px;overflow:hidden;
}

.call-controls{
  width:100%;
  padding-bottom:max(36px,env(safe-area-inset-bottom,36px));
  padding-top:16px;
}
.controls-panel{
  background:#d4d0c6;border-radius:18px;padding:6px;
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
}
.ctrl-btn{
  padding:18px 12px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  font-size:15px;font-weight:500;color:#2d3a1e;
  cursor:pointer;background:#e8e4da;border:none;
  transition:background .15s;
}
.ctrl-btn:hover{background:#ddd8cc}
.ctrl-btn:active{background:#ccc8be;transform:scale(.97)}
.ctrl-btn.muted{background:#c8d4b4;color:#4a6030}
.ctrl-btn.end-btn{color:#c0392b;background:#f0dcd8}
.ctrl-btn.end-btn:hover{background:#e8cdc8}
.ctrl-btn svg{width:18px;height:18px}

/* ── POST-CALL ── */
#postcall{justify-content:flex-start;padding-left:28px;padding-right:28px}

.postcall-header{
  width:100%;
  padding-top:max(80px,env(safe-area-inset-top,80px));
  padding-bottom:32px;
  font-size:24px;font-weight:600;color:#2d3a1e;letter-spacing:-.3px;line-height:1.3;
}

.rating-card{
  width:100%;background:#c8d8a8;border-radius:22px;
  padding:36px 28px;
  display:flex;flex-direction:column;align-items:center;gap:20px;
}
.rating-question{font-size:16px;font-weight:500;color:#4a6030}
.stars{display:flex;gap:10px}
.star{
  width:44px;height:44px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.star svg{width:36px;height:36px;transition:transform .15s}
.star:hover svg{transform:scale(1.15)}
.star svg .star-path{fill:rgba(74,96,48,.25);stroke:rgba(74,96,48,.4);stroke-width:1.5}
.star.filled svg .star-path{fill:#4a6030;stroke:#4a6030}

.continue-btn{
  width:100%;margin-top:24px;
  padding:18px 24px;
  background:#8aaa6a;border:none;border-radius:14px;
  color:#fff;font-size:16px;font-weight:500;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:background .15s,transform .15s;
}
.continue-btn:hover{background:#7a9c5a}
.continue-btn:active{transform:scale(.98)}
</style>
</head>
<body>

<!-- HOME -->
<div class="screen active" id="home">
  <div class="home-greeting" id="greeting">Good evening</div>
  <div class="home-title">Your Telugu<br>voice assistant</div>

  <div class="call-card" onclick="startCall()">
    <div class="card-phone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 10.8a19.79 19.79 0 01-3.07-8.68A2 2 0 012 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
      </svg>
    </div>
    <div class="card-name">Yodha</div>
    <div class="card-hint">Tap to start talking</div>
  </div>

  <p class="disclaimer">Yodha can make mistakes. Always double-check important information.</p>
</div>

<!-- CALL -->
<div class="screen" id="call">
  <div class="call-header">
    <div class="call-title">Yodha</div>
    <div class="call-timer" id="callTimer">00:00</div>
  </div>

  <div class="orb-wrap">
    <div class="orb idle" id="orb"></div>
  </div>

  <div class="call-status" id="statusLabel">Ready to talk</div>
  <div class="transcript-peek" id="transcriptPeek"></div>

  <div class="call-controls">
    <div class="controls-panel">
      <button class="ctrl-btn" id="muteBtn" onclick="toggleMute()">
        <svg id="muteIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
          <path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/>
        </svg>
        <span id="muteLbl">Mute</span>
      </button>
      <button class="ctrl-btn end-btn" onclick="endCall()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.68 13.31a16 16 0 003.41 2.6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 17.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-3-2.31M2.07 4.74A19.79 19.79 0 005.14 13.37M1 1l22 22"/>
        </svg>
        End call
      </button>
    </div>
  </div>
</div>

<!-- POST-CALL -->
<div class="screen" id="postcall">
  <div class="postcall-header">Thank you for<br>talking to Yodha</div>

  <div class="rating-card">
    <div class="rating-question">How was your conversation?</div>
    <div class="stars" id="stars"></div>
  </div>

  <button class="continue-btn" onclick="startNewCall()">
    Start a new conversation
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
      <path d="M5 12h14M12 5l7 7-7 7"/>
    </svg>
  </button>
</div>

<script>
const API = "https://telugu-voice-app.gentletree-f4002f64.southindia.azurecontainerapps.io";
let sharedAudio = new Audio();
sharedAudio.playsInline = true;

let active = false, rec = null, chunks = [], history = [], muted = false;
let audioCtx = null, analyser = null, silenceTimer = null, noSpeechTimer = null, monitorRAF = null;
let hasSpoken = false, endedByTimeout = false, userStopped = false;
let timerInterval = null, callSeconds = 0;
let starRating = 0;

// Greeting by time of day
(function setGreeting() {
  const h = new Date().getHours();
  const label = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : h < 21 ? 'Good evening' : 'Good night';
  document.getElementById('greeting').textContent = label;
})();

// Star rating setup
(function buildStars() {
  const container = document.getElementById('stars');
  for (let i = 1; i <= 5; i++) {
    const btn = document.createElement('button');
    btn.className = 'star';
    btn.setAttribute('data-val', i);
    btn.innerHTML = `<svg viewBox="0 0 24 24"><path class="star-path" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
    btn.onclick = () => setRating(i);
    container.appendChild(btn);
  }
})();

function setRating(val) {
  starRating = val;
  document.querySelectorAll('.star').forEach(s => {
    s.classList.toggle('filled', parseInt(s.dataset.val) <= val);
  });
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startCall() {
  showScreen('call');
  callSeconds = 0;
  updateTimer();
  timerInterval = setInterval(() => { callSeconds++; updateTimer(); }, 1000);
  sharedAudio.play().catch(() => {});
  start();
}

function endCall() {
  clearInterval(timerInterval);
  timerInterval = null;
  active = false;
  userStopped = true;
  sharedAudio.pause();
  sharedAudio.currentTime = 0;
  if (rec?.state === 'recording') rec.stop();
  cleanupMonitor();
  history = [];
  setOrbState('idle');
  setStatus('Ready to talk');
  document.getElementById('transcriptPeek').textContent = '';
  starRating = 0;
  document.querySelectorAll('.star').forEach(s => s.classList.remove('filled'));
  showScreen('postcall');
}

function startNewCall() {
  showScreen('home');
  callSeconds = 0;
  document.getElementById('callTimer').textContent = '00:00';
}

function updateTimer() {
  const m = Math.floor(callSeconds / 60).toString().padStart(2, '0');
  const s = (callSeconds % 60).toString().padStart(2, '0');
  document.getElementById('callTimer').textContent = `${m}:${s}`;
}

function toggleMute() {
  muted = !muted;
  const btn = document.getElementById('muteBtn');
  btn.classList.toggle('muted', muted);
  document.getElementById('muteLbl').textContent = muted ? 'Unmute' : 'Mute';
  document.getElementById('muteIcon').innerHTML = muted
    ? `<line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 005.12 2.12M15 9.34V4a3 3 0 00-5.94-.6"/><path d="M17 16.95A7 7 0 015 12v-2m14 0v2a7 7 0 01-.11 1.23M12 19v4M8 23h8"/>`
    : `<path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/>`;
  if (muted && sharedAudio) sharedAudio.pause();
}

function setOrbState(state) {
  const orb = document.getElementById('orb');
  orb.className = 'orb ' + (state || 'idle');
}

function setStatus(txt) {
  document.getElementById('statusLabel').textContent = txt || 'Ready to talk';
}

async function start() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = [];
    hasSpoken = false;
    endedByTimeout = false;
    userStopped = false;
    rec = new MediaRecorder(stream);
    rec.ondataavailable = e => e.data.size > 0 && chunks.push(e.data);
    rec.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      cleanupMonitor();
      if (endedByTimeout || userStopped) {
        chunks = [];
        active = false;
        setOrbState('idle');
        setStatus('Ready to talk');
        return;
      }
      process();
    };
    rec.start(100);
    active = true;
    setOrbState('listening');
    setStatus('Listening...');

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    source.connect(analyser);
    const freqData = new Uint8Array(analyser.frequencyBinCount);

    const SPEECH_THRESHOLD = 25;
    const SILENCE_HOLD_MS = 1500;
    const NO_SPEECH_TIMEOUT_MS = 10000;

    noSpeechTimer = setTimeout(() => {
      if (!hasSpoken) { endedByTimeout = true; if (rec?.state === 'recording') rec.stop(); }
    }, NO_SPEECH_TIMEOUT_MS);

    function monitor() {
      if (!analyser) return;
      analyser.getByteFrequencyData(freqData);
      const avg = freqData.reduce((a, b) => a + b, 0) / freqData.length;
      if (avg > SPEECH_THRESHOLD) {
        if (!hasSpoken) { hasSpoken = true; clearTimeout(noSpeechTimer); }
        clearTimeout(silenceTimer);
        silenceTimer = setTimeout(() => { if (rec?.state === 'recording') rec.stop(); }, SILENCE_HOLD_MS);
      }
      monitorRAF = requestAnimationFrame(monitor);
    }
    monitor();
  } catch {
    setStatus('Microphone permission required');
  }
}

function cleanupMonitor() {
  if (monitorRAF) cancelAnimationFrame(monitorRAF);
  clearTimeout(silenceTimer);
  clearTimeout(noSpeechTimer);
  if (audioCtx) { try { audioCtx.close(); } catch(e) {} audioCtx = null; }
  analyser = null;
}

async function process() {
  if (!chunks.length) { setOrbState('idle'); setStatus('Ready to talk'); return; }
  setOrbState('thinking');
  setStatus('Thinking...');

  const blob = new Blob(chunks, { type: 'audio/webm' });
  const b64 = await new Promise(res => {
    const r = new FileReader();
    r.onloadend = () => res(r.result.split(',')[1]);
    r.readAsDataURL(blob);
  });

  try {
    const resp = await fetch(`${API}/converse`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ audio_base64: b64, history })
    });
    const data = await resp.json();
    if (data.transcript) {
      document.getElementById('transcriptPeek').textContent = data.transcript;
    }
    if (data.history) history = data.history;
    if (data.audio_base64 && !muted) {
      await playAudio(data.audio_base64);
    } else {
      setOrbState('idle');
      setStatus('Ready to talk');
    }
    if (active && !userStopped) setTimeout(() => start(), 400);
  } catch {
    setStatus('Error — please try again');
    setOrbState('idle');
    active = false;
  }
}

function playAudio(b64) {
  return new Promise(res => {
    setOrbState('speaking');
    setStatus('Speaking...');
    const bytes = atob(b64);
    const buf = new Uint8Array(bytes.length);
    for (let i = 0; i < bytes.length; i++) buf[i] = bytes.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
    sharedAudio.src = url;
    sharedAudio.onended = () => {
      URL.revokeObjectURL(url);
      setOrbState('idle');
      setStatus('Ready to talk');
      res();
    };
    sharedAudio.onerror = () => res();
    sharedAudio.play().catch(() => res());
  });
}
</script>
</body>
</html>
