<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>యోధ — AI అసిస్టెంట్</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;background:#080810;color:#fff;overflow:hidden}

:root{
  --bg:#080810;
  --surface:rgba(255,255,255,.04);
  --surface-hover:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.08);
  --border-light:rgba(255,255,255,.12);
  --accent:#6366f1;
  --accent2:#8b5cf6;
  --accent-glow:rgba(99,102,241,.3);
  --text:#f8f8ff;
  --text-muted:rgba(248,248,255,.45);
  --text-dim:rgba(248,248,255,.25);
  --red:#ef4444;
  --red-glow:rgba(239,68,68,.25);
  --green:#10b981;
}

body{display:flex;align-items:center;justify-content:center;min-height:100%}

body::before{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;z-index:0;opacity:.5;
}

body::after{
  content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse 80% 60% at 50% 0%, rgba(99,102,241,.12) 0%, transparent 70%),
             radial-gradient(ellipse 60% 40% at 80% 100%, rgba(139,92,246,.08) 0%, transparent 60%);
  pointer-events:none;z-index:0;
}

.screen{
  display:none;position:relative;z-index:1;
  width:100%;max-width:440px;height:100dvh;
  flex-direction:column;align-items:center;
  padding:env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
}
.screen.active{display:flex}

#home{justify-content:space-between;padding:0 24px}

.home-top{
  width:100%;padding-top:max(56px, env(safe-area-inset-top, 56px));
  text-align:left;
}
.brand-tag{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:100px;padding:6px 14px 6px 10px;
  margin-bottom:32px;
}
.brand-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.brand-tag span{font-size:12px;font-weight:500;color:var(--text-muted);letter-spacing:.5px;text-transform:uppercase}

.home-headline{font-size:clamp(28px,7vw,36px);font-weight:700;line-height:1.15;letter-spacing:-1px;color:var(--text)}
.home-headline em{font-style:normal;background:linear-gradient(135deg,#6366f1,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.home-sub{margin-top:12px;font-size:15px;font-weight:400;color:var(--text-muted);line-height:1.6;max-width:300px}

.home-avatar-wrap{
  flex:1;display:flex;align-items:center;justify-content:center;
  position:relative;width:100%;
}
.home-avatar{
  width:180px;height:180px;border-radius:50%;
  position:relative;cursor:pointer;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
}
.home-avatar:hover{transform:scale(1.04)}
.home-avatar:active{transform:scale(.97)}
.home-avatar-ring{
  position:absolute;inset:-20px;border-radius:50%;
  border:1px solid rgba(99,102,241,.2);
  animation:homeRing 4s linear infinite;
}
.home-avatar-ring2{
  position:absolute;inset:-40px;border-radius:50%;
  border:1px solid rgba(99,102,241,.1);
  animation:homeRing 7s linear infinite reverse;
}
@keyframes homeRing{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.home-avatar-face{
  width:100%;height:100%;border-radius:50%;
  background:radial-gradient(ellipse at 35% 30%, #7c8dff 0%, #6366f1 40%, #4338ca 75%, #1e1b4b 100%);
  box-shadow:0 0 60px rgba(99,102,241,.4), 0 0 120px rgba(99,102,241,.15), inset 0 -20px 40px rgba(0,0,0,.3), inset 0 12px 30px rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;
  animation:homeFaceFloat 5s ease-in-out infinite;
  overflow:hidden;
}
@keyframes homeFaceFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

.home-avatar-face::before{
  content:'';position:absolute;top:15%;left:20%;
  width:50%;height:35%;
  background:radial-gradient(ellipse, rgba(255,255,255,.18) 0%, transparent 70%);
  border-radius:50%;
  transform:rotate(-20deg);
}

.home-avatar-label{
  position:absolute;bottom:-48px;left:50%;transform:translateX(-50%);
  white-space:nowrap;
  font-size:13px;color:var(--text-muted);
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.home-avatar-label strong{font-size:18px;font-weight:600;color:var(--text);letter-spacing:-.3px}

.home-cta{
  width:100%;padding-bottom:max(40px, env(safe-area-inset-bottom, 40px));
}
.cta-btn{
  width:100%;padding:18px 24px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  border:none;border-radius:16px;
  color:#fff;font-size:16px;font-weight:600;
  cursor:pointer;letter-spacing:-.2px;
  box-shadow:0 8px 32px rgba(99,102,241,.4);
  transition:transform .18s ease,box-shadow .18s ease;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.cta-btn:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(99,102,241,.5)}
.cta-btn:active{transform:translateY(0) scale(.98);box-shadow:0 4px 20px rgba(99,102,241,.3)}
.cta-btn svg{width:20px;height:20px}

.home-footer{
  text-align:center;margin-top:14px;
  font-size:12px;color:var(--text-dim);
}

#call{justify-content:flex-start;gap:0;padding:0 24px}

.call-nav{
  width:100%;padding-top:max(52px, env(safe-area-inset-top, 52px));
  padding-bottom:8px;
  display:flex;align-items:center;justify-content:space-between;
}
.call-back{
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:8px 14px;
  font-size:13px;font-weight:500;color:var(--text-muted);
  cursor:pointer;display:flex;align-items:center;gap:6px;
  transition:background .15s,color .15s;
}
.call-back:hover{background:var(--surface-hover);color:var(--text)}
.call-back svg{width:16px;height:16px}

.call-meta{text-align:right}
.call-name-badge{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:100px;padding:6px 12px;
}
.call-status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;box-shadow:0 0 6px var(--green)}
.call-status-dot.inactive{background:var(--text-dim);box-shadow:none}
.call-name-text{font-size:13px;font-weight:500;color:var(--text)}
.call-timer-text{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums;margin-top:2px;text-align:right}

.call-avatar-wrap{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:100%;position:relative;
  gap:32px;
}

.avatar-rings{position:relative;display:flex;align-items:center;justify-content:center}

.ring{
  position:absolute;border-radius:50%;border:1px solid transparent;
}
.ring1{
  width:300px;height:300px;
  border-color:rgba(99,102,241,.12);
  animation:ringRotate 12s linear infinite;
}
.ring2{
  width:240px;height:240px;
  border-color:rgba(139,92,246,.08);
  border-style:dashed;
  animation:ringRotate 8s linear infinite reverse;
}
.ring1::after,.ring2::after{
  content:'';position:absolute;top:0;left:50%;
  transform:translateX(-50%);
  width:8px;height:8px;margin-top:-4px;
  border-radius:50%;background:#6366f1;
}
.ring2::after{background:#8b5cf6;width:6px;height:6px;margin-top:-3px}
@keyframes ringRotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.avatar-rings.idle .ring1,.avatar-rings.idle .ring2{opacity:.5}
.avatar-rings.listening .ring1{animation-duration:6s;border-color:rgba(99,102,241,.3)}
.avatar-rings.listening .ring2{animation-duration:4s;border-color:rgba(139,92,246,.2)}
.avatar-rings.speaking .ring1{animation-duration:4s;border-color:rgba(99,102,241,.5)}
.avatar-rings.speaking .ring2{animation-duration:2.5s;border-color:rgba(139,92,246,.35)}
.avatar-rings.thinking .ring1,.avatar-rings.thinking .ring2{opacity:.3;animation-duration:20s}

.avatar-face{
  width:200px;height:200px;border-radius:50%;
  position:relative;z-index:2;
  background:radial-gradient(ellipse at 35% 30%, #7c8dff 0%, #6366f1 40%, #4338ca 75%, #1e1b4b 100%);
  box-shadow:0 0 80px rgba(99,102,241,.35), 0 0 160px rgba(99,102,241,.1), inset 0 -24px 48px rgba(0,0,0,.35), inset 0 16px 40px rgba(255,255,255,.14);
  transition:border-radius .4s ease, box-shadow .4s ease, transform .3s ease;
  overflow:hidden;
  animation:avatarIdle 5s ease-in-out infinite;
}
.avatar-face::before{
  content:'';position:absolute;top:12%;left:18%;
  width:50%;height:35%;
  background:radial-gradient(ellipse, rgba(255,255,255,.2) 0%, transparent 70%);
  border-radius:50%;transform:rotate(-20deg);
}

@keyframes avatarIdle{0%,100%{transform:scale(1) translateY(0)}50%{transform:scale(1.015) translateY(-6px)}}

.avatar-face.listening{
  animation:avatarListen 1.6s ease-in-out infinite;
  box-shadow:0 0 100px rgba(99,102,241,.55), 0 0 200px rgba(99,102,241,.18), inset 0 -24px 48px rgba(0,0,0,.3), inset 0 16px 40px rgba(255,255,255,.18);
}
@keyframes avatarListen{
  0%{transform:scale(1);border-radius:50%}
  25%{transform:scale(1.04);border-radius:52% 48% 54% 46%/46% 54% 46% 54%}
  50%{transform:scale(1.07);border-radius:50%}
  75%{transform:scale(1.04);border-radius:47% 53% 46% 54%/54% 46% 54% 46%}
  100%{transform:scale(1);border-radius:50%}
}

.avatar-face.speaking{
  animation:avatarSpeak .85s ease-in-out infinite;
  box-shadow:0 0 120px rgba(99,102,241,.65), 0 0 240px rgba(99,102,241,.22), inset 0 -28px 56px rgba(0,0,0,.28), inset 0 18px 44px rgba(255,255,255,.2);
}
@keyframes avatarSpeak{
  0%{transform:scale(1);border-radius:50%}
  20%{transform:scale(1.08);border-radius:54% 46% 58% 42%/42% 58% 42% 58%}
  40%{transform:scale(1.05);border-radius:47% 53% 44% 56%/56% 44% 56% 44%}
  60%{transform:scale(1.1);border-radius:52% 48% 53% 47%/47% 53% 47% 53%}
  80%{transform:scale(1.06);border-radius:50% 50% 47% 53%/53% 47% 53% 47%}
  100%{transform:scale(1);border-radius:50%}
}

.avatar-face.thinking{
  animation:avatarThink 2.4s ease-in-out infinite;
  opacity:.75;
  box-shadow:0 0 60px rgba(99,102,241,.25), 0 0 120px rgba(99,102,241,.08), inset 0 -24px 48px rgba(0,0,0,.35);
}
@keyframes avatarThink{0%,100%{transform:scale(.96) translateY(0)}50%{transform:scale(1.02) translateY(-4px)}}

.sound-bars{
  display:flex;align-items:center;justify-content:center;gap:4px;
  height:32px;opacity:0;transition:opacity .3s;
}
.sound-bars.active{opacity:1}
.bar{
  width:3px;border-radius:100px;background:linear-gradient(to top,#6366f1,#a78bfa);
  transform-origin:bottom;
}
.bar:nth-child(1){animation:barBounce 1.1s ease-in-out infinite .0s;height:10px}
.bar:nth-child(2){animation:barBounce 1.1s ease-in-out infinite .15s;height:18px}
.bar:nth-child(3){animation:barBounce 1.1s ease-in-out infinite .05s;height:24px}
.bar:nth-child(4){animation:barBounce 1.1s ease-in-out infinite .2s;height:16px}
.bar:nth-child(5){animation:barBounce 1.1s ease-in-out infinite .1s;height:10px}
@keyframes barBounce{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}

.status-chip{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:100px;padding:8px 16px;
  font-size:13px;font-weight:500;color:var(--text-muted);
  transition:all .3s ease;min-width:180px;justify-content:center;
}
.status-chip .s-dot{
  width:6px;height:6px;border-radius:50%;background:var(--text-dim);flex-shrink:0;
  transition:background .3s,box-shadow .3s;
}
.status-chip.listening{border-color:rgba(99,102,241,.3);color:rgba(168,162,255,.9)}
.status-chip.listening .s-dot{background:#818cf8;box-shadow:0 0 8px #6366f1;animation:dotPulse .8s ease-in-out infinite}
.status-chip.speaking{border-color:rgba(139,92,246,.3);color:rgba(196,181,253,.9)}
.status-chip.speaking .s-dot{background:#a78bfa;box-shadow:0 0 8px #8b5cf6}
.status-chip.thinking{border-color:var(--border);color:var(--text-muted)}
.status-chip.thinking .s-dot{background:#6366f1;animation:dotPulse 1.4s ease-in-out infinite}
@keyframes dotPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}

.transcript-bubble{
  width:100%;max-width:340px;margin-top:4px;
  background:rgba(255,255,255,.04);border:1px solid var(--border);
  border-radius:14px;padding:12px 16px;
  font-size:13px;color:var(--text-muted);line-height:1.6;
  max-height:72px;overflow:hidden;
  opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;
  display:none;
}
.transcript-bubble.show{opacity:1;transform:none;display:block}

.call-panel{
  width:100%;padding:0 0 max(32px, env(safe-area-inset-bottom, 32px));
}

.panel-inner{
  background:rgba(255,255,255,.04);
  border:1px solid var(--border);
  border-radius:24px;
  padding:20px 24px;
  display:flex;flex-direction:column;gap:16px;
}

.panel-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}

.panel-label{
  font-size:12px;font-weight:500;color:var(--text-dim);letter-spacing:.4px;text-transform:uppercase;
}

.ctrl-group{display:flex;align-items:center;gap:12px}

.ctrl{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  background:none;border:none;cursor:pointer;padding:0;
}
.ctrl-circle{
  width:52px;height:52px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface);border:1px solid var(--border);
  transition:background .18s, border-color .18s, transform .15s;
}
.ctrl-circle svg{width:20px;height:20px;color:var(--text-muted);transition:color .18s}
.ctrl:hover .ctrl-circle{background:var(--surface-hover);border-color:var(--border-light)}
.ctrl:hover .ctrl-circle svg{color:var(--text)}
.ctrl:active .ctrl-circle{transform:scale(.93)}
.ctrl-lbl{font-size:11px;color:var(--text-dim);font-weight:400}

.ctrl.muted .ctrl-circle{background:rgba(99,102,241,.12);border-color:rgba(99,102,241,.3)}
.ctrl.muted .ctrl-circle svg{color:#818cf8}

.end-btn{
  flex:1;padding:16px 20px;
  background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);
  border-radius:14px;
  color:#ef4444;font-size:15px;font-weight:600;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:background .18s, border-color .18s, transform .15s;
}
.end-btn svg{width:18px;height:18px}
.end-btn:hover{background:rgba(239,68,68,.18);border-color:rgba(239,68,68,.35)}
.end-btn:active{transform:scale(.97)}
</style>
</head>
<body>

<div class="screen active" id="home">
  <div class="home-top">
    <div class="brand-tag">
      <div class="brand-dot"></div>
      <span>AI అసిస్టెంట్</span>
    </div>
    <h1 class="home-headline">మీ <em>తెలుగు</em><br>AI సహాయకుడు</h1>
    <p class="home-sub" id="homeGreeting">శుభ సాయంత్రం! నేను మీకు ఏవిధంగా సహాయపడగలను?</p>
  </div>

  <div class="home-avatar-wrap">
    <div class="home-avatar" onclick="startCall()">
      <div class="home-avatar-ring"></div>
      <div class="home-avatar-ring2"></div>
      <div class="home-avatar-face"></div>
      <div class="home-avatar-label">
        <strong>యోధ</strong>
        <span>నొక్కి మాట్లాడండి</span>
      </div>
    </div>
  </div>

  <div class="home-cta">
    <button class="cta-btn" onclick="startCall()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 10.8a19.79 19.79 0 01-3.07-8.68A2 2 0 012 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 14.92z"/>
      </svg>
      సంభాషణ ప్రారంభించండి
    </button>
    <p class="home-footer">తెలుగులో మాట్లాడండి &nbsp;·&nbsp; AI స్వయంచాలకంగా స్పందిస్తుంది</p>
  </div>
</div>

<div class="screen" id="call">
  <div class="call-nav">
    <button class="call-back" onclick="endCall()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
      వెనక్కి
    </button>
    <div class="call-meta">
      <div class="call-name-badge">
        <div class="call-status-dot inactive" id="callDot"></div>
        <span class="call-name-text">యోధ</span>
      </div>
      <div class="call-timer-text" id="callTimer">00:00</div>
    </div>
  </div>

  <div class="call-avatar-wrap">
    <div class="avatar-rings idle" id="avatarRings">
      <div class="ring ring1"></div>
      <div class="ring ring2"></div>
      <div class="avatar-face idle" id="avatarFace"></div>
    </div>

    <div class="sound-bars" id="soundBars">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

    <div class="status-chip" id="statusChip">
      <div class="s-dot"></div>
      <span id="statusTxt">సంభాషించడానికి సిద్ధం</span>
    </div>

    <div class="transcript-bubble" id="transcriptBubble"></div>
  </div>

  <div class="call-panel">
    <div class="panel-inner">
      <div class="panel-row">
        <span class="panel-label">నియంత్రణలు</span>
        <div class="ctrl-group">
          <button class="ctrl" id="muteBtn" onclick="toggleMute()" title="Mute">
            <div class="ctrl-circle">
              <svg id="muteIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
                <path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/>
              </svg>
            </div>
            <span class="ctrl-lbl" id="muteLbl">Mute</span>
          </button>
        </div>
      </div>
      <button class="end-btn" onclick="endCall()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.68 13.31a16 16 0 003.41 2.6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-3-2.31M2.07 4.74A19.79 19.79 0 005.14 13.37M1 1l22 22"/>
        </svg>
        కాల్ ముగించు
      </button>
    </div>
  </div>
</div>

<script>
const API = "https://telugu-voice-app.gentletree-f4002f64.southindia.azurecontainerapps.io";
let sharedAudio = new Audio();
sharedAudio.playsInline = true;

let active = false, rec = null, chunks = [], history = [], muted = false;
let audioCtx = null, analyser = null, silenceTimer = null, noSpeechTimer = null, monitorRAF = null;
let hasSpoken = false, endedByTimeout = false, userStopped = false;
let timerInterval = null, callSeconds = 0;

(function setGreeting() {
  const h = new Date().getHours();
  const greetings = [
    [5,  12, 'శుభోదయం'],
    [12, 17, 'శుభ మధ్యాహ్నం'],
    [17, 21, 'శుభ సాయంత్రం'],
    [21, 24, 'శుభ రాత్రి'],
    [0,  5,  'శుభ రాత్రి'],
  ];
  const g = greetings.find(([s,e]) => h >= s && h < e)?.[2] ?? 'నమస్కారం';
  document.getElementById('homeGreeting').textContent = `${g}! నేను మీకు ఏవిధంగా సహాయపడగలను?`;
})();

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startCall() {
  showScreen('call');
  callSeconds = 0;
  updateTimer();
  timerInterval = setInterval(() => { callSeconds++; updateTimer(); }, 1000);
  document.getElementById('callDot').classList.remove('inactive');
  sharedAudio.play().catch(() => {});
  start();
}

function endCall() {
  clearInterval(timerInterval);
  timerInterval = null;
  callSeconds = 0;
  active = false;
  userStopped = true;
  sharedAudio.pause();
  sharedAudio.currentTime = 0;
  if (rec?.state === 'recording') rec.stop();
  cleanupMonitor();
  history = [];
  document.getElementById('callDot').classList.add('inactive');
  setAvatarState('idle');
  setStatus('', '');
  hideTranscript();
  showScreen('home');
}

function updateTimer() {
  const m = Math.floor(callSeconds / 60).toString().padStart(2, '0');
  const s = (callSeconds % 60).toString().padStart(2, '0');
  document.getElementById('callTimer').textContent = `${m}:${s}`;
}

function toggleMute() {
  muted = !muted;
  const btn = document.getElementById('muteBtn');
  btn.classList.toggle('muted', muted);
  document.getElementById('muteLbl').textContent = muted ? 'Unmute' : 'Mute';
  document.getElementById('muteIcon').innerHTML = muted
    ? `<line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 005.12 2.12M15 9.34V4a3 3 0 00-5.94-.6"/><path d="M17 16.95A7 7 0 015 12v-2m14 0v2a7 7 0 01-.11 1.23M12 19v4M8 23h8"/>`
    : `<path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/>`;
  if (muted && sharedAudio) sharedAudio.pause();
}

function setAvatarState(state) {
  const rings = document.getElementById('avatarRings');
  const face = document.getElementById('avatarFace');
  const bars = document.getElementById('soundBars');
  rings.className = 'avatar-rings ' + (state || 'idle');
  face.className = 'avatar-face ' + (state || 'idle');
  bars.classList.toggle('active', state === 'listening' || state === 'speaking');
}

function setStatus(txt, state) {
  const chip = document.getElementById('statusChip');
  const span = document.getElementById('statusTxt');
  chip.className = 'status-chip' + (state ? ' ' + state : '');
  span.textContent = txt || 'సంభాషించడానికి సిద్ధం';
}

function showTranscript(text) {
  const el = document.getElementById('transcriptBubble');
  el.textContent = text;
  el.classList.add('show');
}

function hideTranscript() {
  document.getElementById('transcriptBubble').classList.remove('show');
}

async function start() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = [];
    hasSpoken = false;
    endedByTimeout = false;
    userStopped = false;
    rec = new MediaRecorder(stream);
    rec.ondataavailable = e => e.data.size > 0 && chunks.push(e.data);
    rec.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      cleanupMonitor();
      if (endedByTimeout || userStopped) {
        chunks = [];
        active = false;
        setAvatarState('idle');
        setStatus('సంభాషించడానికి సిద్ధం', '');
        return;
      }
      process();
    };
    rec.start(100);
    active = true;
    setAvatarState('listening');
    setStatus('వింటున్నాను...', 'listening');

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    source.connect(analyser);
    const freqData = new Uint8Array(analyser.frequencyBinCount);

    const SPEECH_THRESHOLD = 25;
    const SILENCE_HOLD_MS = 1500;
    const NO_SPEECH_TIMEOUT_MS = 10000;

    noSpeechTimer = setTimeout(() => {
      if (!hasSpoken) {
        endedByTimeout = true;
        if (rec?.state === 'recording') rec.stop();
      }
    }, NO_SPEECH_TIMEOUT_MS);

    function monitor() {
      if (!analyser) return;
      analyser.getByteFrequencyData(freqData);
      const avg = freqData.reduce((a, b) => a + b, 0) / freqData.length;
      if (avg > SPEECH_THRESHOLD) {
        if (!hasSpoken) { hasSpoken = true; clearTimeout(noSpeechTimer); }
        clearTimeout(silenceTimer);
        silenceTimer = setTimeout(() => {
          if (rec?.state === 'recording') rec.stop();
        }, SILENCE_HOLD_MS);
      }
      monitorRAF = requestAnimationFrame(monitor);
    }
    monitor();
  } catch {
    setStatus('మైక్ అనుమతి అవసరం', '');
  }
}

function cleanupMonitor() {
  if (monitorRAF) cancelAnimationFrame(monitorRAF);
  clearTimeout(silenceTimer);
  clearTimeout(noSpeechTimer);
  if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; }
  analyser = null;
}

async function process() {
  if (!chunks.length) { setAvatarState('idle'); setStatus('సంభాషించడానికి సిద్ధం', ''); return; }
  setAvatarState('thinking');
  setStatus('ఆలోచిస్తున్నాను...', 'thinking');

  const blob = new Blob(chunks, { type: 'audio/webm' });
  const b64 = await new Promise(res => {
    const r = new FileReader();
    r.onloadend = () => res(r.result.split(',')[1]);
    r.readAsDataURL(blob);
  });

  try {
    const resp = await fetch(`${API}/converse`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ audio_base64: b64, history })
    });
    const data = await resp.json();
    if (data.transcript) showTranscript(data.transcript);
    if (data.history) history = data.history;
    if (data.audio_base64 && !muted) {
      await playAudio(data.audio_base64);
    } else {
      setAvatarState('idle');
      setStatus('సంభాషించడానికి సిద్ధం', '');
    }
    if (active && !userStopped) setTimeout(() => start(), 400);
  } catch {
    setStatus('లోపం వచ్చింది — మళ్ళీ ప్రయత్నించండి', '');
    setAvatarState('idle');
    active = false;
  }
}

function playAudio(b64) {
  return new Promise(res => {
    setAvatarState('speaking');
    setStatus('జవాబు చెప్తున్నాను...', 'speaking');
    const bytes = atob(b64);
    const buf = new Uint8Array(bytes.length);
    for (let i = 0; i < bytes.length; i++) buf[i] = bytes.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
    sharedAudio.src = url;
    sharedAudio.onended = () => {
      URL.revokeObjectURL(url);
      setAvatarState('idle');
      setStatus('సంభాషించడానికి సిద్ధం', '');
      res();
    };
    sharedAudio.onerror = () => res();
    sharedAudio.play().catch(() => res());
  });
}
