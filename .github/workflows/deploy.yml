name: Build & Deploy to Azure Container Apps

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Build image directly on ACR (no Docker daemon needed locally)
      - name: Build & push image via ACR
        run: |
          az acr build \
            --registry ${{ secrets.ACR_NAME }} \
            --image telugu-voice-ai:${{ github.sha }} \
            --image telugu-voice-ai:latest \
            --file voice-assistant/Dockerfile \
            .

      # Fail fast (before touching the live app) if a required secret is missing.
      - name: Check required secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YODHA_USERS: ${{ secrets.YODHA_USERS }}
          YODHA_AUTH_SECRET: ${{ secrets.YODHA_AUTH_SECRET }}
        run: |
          missing=0
          for v in GEMINI_API_KEY YODHA_USERS YODHA_AUTH_SECRET; do
            if [ -z "${!v}" ]; then echo "::error::GitHub secret $v is not set"; missing=1; fi
          done
          if [ ${#YODHA_AUTH_SECRET} -lt 32 ]; then echo "::error::YODHA_AUTH_SECRET must be at least 32 characters"; missing=1; fi
          exit $missing

      # Store keys as Container Apps secrets (not plain env vars), then reference them.
      # Values are passed via env (never inlined in the script), so '$' in hashes is safe.
      - name: Set Container App secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YODHA_USERS: ${{ secrets.YODHA_USERS }}
          YODHA_AUTH_SECRET: ${{ secrets.YODHA_AUTH_SECRET }}
        run: |
          az containerapp secret set \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --secrets \
              "gemini-api-key=$GEMINI_API_KEY" \
              "yodha-users=$YODHA_USERS" \
              "yodha-auth-secret=$YODHA_AUTH_SECRET" \
            --output none

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/telugu-voice-ai:${{ github.sha }} \
            --min-replicas 1 \
            --set-env-vars \
              GEMINI_API_KEY=secretref:gemini-api-key \
              YODHA_USERS=secretref:yodha-users \
              YODHA_AUTH_SECRET=secretref:yodha-auth-secret \
            --output none
