name: Build & Deploy to Azure Container Apps

on:
  push:
    branches: [main]

permissions:
  contents: read

# One deploy at a time; a newer push waits for the running deploy instead of racing it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Build image directly on ACR (no Docker daemon needed locally)
      - name: Build & push image via ACR
        run: |
          az acr build \
            --registry ${{ secrets.ACR_NAME }} \
            --image telugu-voice-ai:${{ github.sha }} \
            --image telugu-voice-ai:latest \
            --file voice-assistant/Dockerfile \
            .

      # Fail fast (before touching the live app) if a required secret is missing.
      - name: Check required secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YODHA_USERS: ${{ secrets.YODHA_USERS }}
          YODHA_AUTH_SECRET: ${{ secrets.YODHA_AUTH_SECRET }}
        run: |
          missing=0
          for v in GEMINI_API_KEY YODHA_USERS YODHA_AUTH_SECRET; do
            if [ -z "${!v}" ]; then echo "::error::GitHub secret $v is not set"; missing=1; fi
          done
          if [ ${#YODHA_AUTH_SECRET} -lt 32 ]; then echo "::error::YODHA_AUTH_SECRET must be at least 32 characters"; missing=1; fi
          # Every YODHA_USERS entry must be email:hash. A bare email would deploy an app nobody can log in to.
          entry='^[^:, ]+@[^:, ]+:pbkdf2_sha256\$[0-9]+\$[A-Za-z0-9_-]+\$[A-Za-z0-9_-]+$'
          if [ -n "$YODHA_USERS" ] && printf '%s' "$YODHA_USERS" | tr ',' '\n' | grep -qvE "$entry"; then
            echo "::error::YODHA_USERS has an entry that is not in the form email:pbkdf2_sha256\$... (create entries with voice-assistant/auth.py hash)"; missing=1
          fi
          exit $missing

      # Store keys as Container Apps secrets (not plain env vars), then reference them.
      # Values are passed via env (never inlined in the script), so '$' in hashes is safe.
      - name: Set Container App secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YODHA_USERS: ${{ secrets.YODHA_USERS }}
          YODHA_AUTH_SECRET: ${{ secrets.YODHA_AUTH_SECRET }}
        run: |
          az containerapp secret set \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --secrets \
              "gemini-api-key=$GEMINI_API_KEY" \
              "yodha-users=$YODHA_USERS" \
              "yodha-auth-secret=$YODHA_AUTH_SECRET" \
            --output none

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/telugu-voice-ai:${{ github.sha }} \
            --min-replicas 1 \
            --set-env-vars \
              GEMINI_API_KEY=secretref:gemini-api-key \
              YODHA_USERS=secretref:yodha-users \
              YODHA_AUTH_SECRET=secretref:yodha-auth-secret \
            --output none

      # The update call returns before the new revision is serving. In single-revision mode
      # the previous revision keeps taking traffic if the new one never becomes ready, so a
      # failure here means "the release did not go live", not "the app is down".
      - name: Verify the new revision is live
        env:
          APP: ${{ secrets.CONTAINER_APP_NAME }}
          RG: ${{ secrets.RESOURCE_GROUP }}
        run: |
          for i in $(seq 1 30); do
            read -r latest ready fqdn <<< "$(az containerapp show --name "$APP" --resource-group "$RG" \
              --query "[properties.latestRevisionName, properties.latestReadyRevisionName, properties.configuration.ingress.fqdn]" \
              --output tsv | tr '\n\t' '  ')"
            if [ -n "$latest" ] && [ "$latest" = "$ready" ]; then break; fi
            echo "Waiting for revision $latest to become ready (ready: $ready)"; sleep 10
          done
          if [ "$latest" != "$ready" ]; then
            echo "::error::Revision $latest did not become ready within 5 minutes. The previous revision is still serving."; exit 1
          fi
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --max-time 10 "https://$fqdn/healthz"
          echo
          # The knowledge base loads in the background; without it answers lose the manuals.
          for i in $(seq 1 12); do
            status="$(curl --silent --max-time 10 "https://$fqdn/" || true)"
            case "$status" in *'"kb":"loaded"'*) echo "Knowledge base loaded."; exit 0;; esac
            sleep 10
          done
          echo "::warning::The app is live but the vehicle-manual knowledge base did not load: $status"
