<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>యోధ — Telugu Voice AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;background:#f0ede8}

/* ─── Color tokens ─── */
:root{
  --bg:#f0ede8;
  --surface:#ddd8ce;
  --surface2:#ccc6ba;
  --green:#7a8c6a;
  --green-dark:#4e5e40;
  --green-light:#b8c9a4;
  --green-orb:#9aad88;
  --text:#3d4a30;
  --text-muted:#7a8c6a;
  --text-dim:#a8b898;
  --btn-end:#c94b4b;
  --radius:24px;
}

body{display:flex;align-items:center;justify-content:center;min-height:100%}
.screen{display:none;width:100%;max-width:420px;height:100vh;max-height:780px;position:relative;flex-direction:column;align-items:center;justify-content:flex-start;background:var(--bg)}
.screen.active{display:flex}

/* ═══════════════════════════════
   HOME SCREEN
═══════════════════════════════ */
#home{padding:0}

.home-header{width:100%;padding:56px 32px 32px;text-align:center}
.greeting{font-size:22px;font-weight:500;color:var(--text);letter-spacing:-0.5px}

.call-card{width:calc(100% - 32px);margin:8px 16px;background:var(--surface);border-radius:20px;overflow:hidden;cursor:pointer;transition:transform .18s ease, box-shadow .18s ease;flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;min-height:220px}
.call-card:hover{transform:scale(0.985);box-shadow:0 4px 24px rgba(74,92,58,.12)}
.call-card:active{transform:scale(0.97)}

.call-card .phone-icon{width:36px;height:36px;color:var(--green-dark)}
.call-card .call-label{font-size:22px;font-weight:500;color:var(--green-dark);letter-spacing:-0.3px}

/* ═══════════════════════════════
   ACTIVE CALL SCREEN
═══════════════════════════════ */
#call{padding:0;background:var(--bg)}

.call-header{width:100%;padding:52px 24px 20px;text-align:center}
.call-name{font-size:18px;font-weight:500;color:var(--green-dark);letter-spacing:-0.3px}
.call-timer{font-size:13px;color:var(--text-muted);margin-top:4px;font-variant-numeric:tabular-nums;min-height:18px}

/* Orb */
.orb-wrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%}
.orb-outer{width:220px;height:220px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(154,173,136,.15);position:relative}
.orb-outer::before{
  content:'';position:absolute;inset:-12px;border-radius:50%;
  background:rgba(154,173,136,.08);
  animation:outerPulse 3s ease-in-out infinite;
}
@keyframes outerPulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.06);opacity:1}}

.orb{
  width:160px;height:160px;
  background:radial-gradient(ellipse at 38% 35%, #c5d4b4 0%, #9aad88 45%, #7a8c6a 100%);
  border-radius:50%;
  position:relative;
  transition:border-radius .4s ease;
  box-shadow:0 8px 40px rgba(122,140,106,.35), inset 0 -8px 20px rgba(74,92,58,.15), inset 0 8px 20px rgba(255,255,255,.25);
}
/* idle: gentle float */
.orb.idle{animation:orbFloat 4s ease-in-out infinite}
@keyframes orbFloat{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-8px) scale(1.02)}
}
/* listening: energetic pulse + morph */
.orb.listening{
  animation:orbListen 1.4s ease-in-out infinite;
  background:radial-gradient(ellipse at 38% 35%, #d4e4c0 0%, #a8c090 45%, #7a9c60 100%);
  box-shadow:0 8px 48px rgba(100,160,80,.45), inset 0 -8px 20px rgba(60,100,40,.15), inset 0 8px 20px rgba(255,255,255,.3);
}
@keyframes orbListen{
  0%{transform:scale(1);border-radius:50%}
  25%{transform:scale(1.05);border-radius:52% 48% 55% 45%/48% 52% 48% 52%}
  50%{transform:scale(1.08);border-radius:50%}
  75%{transform:scale(1.05);border-radius:47% 53% 45% 55%/53% 47% 53% 47%}
  100%{transform:scale(1);border-radius:50%}
}
/* speaking: larger morphing blob */
.orb.speaking{
  animation:orbSpeak .9s ease-in-out infinite;
  background:radial-gradient(ellipse at 38% 35%, #d0e4b8 0%, #a0bc80 45%, #6a9060 100%);
  box-shadow:0 12px 56px rgba(90,150,70,.5), inset 0 -10px 24px rgba(50,90,30,.2), inset 0 10px 24px rgba(255,255,255,.35);
}
@keyframes orbSpeak{
  0%{transform:scale(1);border-radius:50%}
  20%{transform:scale(1.1);border-radius:55% 45% 58% 42%/42% 58% 42% 58%}
  40%{transform:scale(1.06);border-radius:48% 52% 44% 56%/56% 44% 56% 44%}
  60%{transform:scale(1.12);border-radius:53% 47% 52% 48%/47% 53% 47% 53%}
  80%{transform:scale(1.07);border-radius:50% 50% 48% 52%/52% 48% 52% 48%}
  100%{transform:scale(1);border-radius:50%}
}
/* thinking: slow morph */
.orb.thinking{
  animation:orbThink 2.2s ease-in-out infinite;
  background:radial-gradient(ellipse at 38% 35%, #c8d8b0 0%, #98aa80 45%, #788a60 100%);
  opacity:.85;
}
@keyframes orbThink{
  0%,100%{transform:scale(.96);border-radius:50%}
  50%{transform:scale(1.04);border-radius:48% 52% 46% 54%/54% 46% 54% 46%}
}

.status-label{
  font-size:13px;color:var(--text-muted);letter-spacing:.3px;
  height:20px;display:flex;align-items:center;gap:6px;
  margin-bottom:8px;transition:color .3s;
}
.status-dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.status-label.listening{color:#5a9040}
.status-label.speaking{color:#4a7a30}
.status-label.thinking{color:var(--text-muted);animation:dimPulse 1.2s ease-in-out infinite}
@keyframes dimPulse{0%,100%{opacity:1}50%{opacity:.45}}

/* Controls */
.call-controls{
  width:100%;padding:20px 32px 48px;
  display:flex;align-items:center;justify-content:center;gap:48px;
}

.ctrl-btn{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  cursor:pointer;background:none;border:none;padding:0;
}
.ctrl-icon{
  width:60px;height:60px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface2);transition:background .2s, transform .15s;
}
.ctrl-btn:hover .ctrl-icon{background:var(--surface);transform:scale(1.05)}
.ctrl-btn:active .ctrl-icon{transform:scale(.94)}
.ctrl-icon svg{width:22px;height:22px;color:var(--green-dark)}
.ctrl-label{font-size:12px;color:var(--text-muted);font-weight:400;letter-spacing:.2px}

.ctrl-btn.end .ctrl-icon{background:#e8a8a8}
.ctrl-btn.end:hover .ctrl-icon{background:#dda0a0}
.ctrl-btn.end .ctrl-icon svg{color:var(--btn-end)}
.ctrl-btn.end .ctrl-label{color:var(--btn-end)}

.ctrl-btn.muted .ctrl-icon{background:var(--surface)}
.ctrl-btn.muted .ctrl-icon svg{color:var(--green-dark)}

/* hint when transcript available */
.transcript-peek{
  width:calc(100% - 32px);margin:0 16px;
  background:var(--surface);border-radius:14px;
  padding:12px 16px;font-size:13px;color:var(--text-muted);
  line-height:1.55;max-height:80px;overflow:hidden;
  text-overflow:ellipsis;
  display:none;
  margin-bottom:12px;
}
.transcript-peek.visible{display:block}
</style>
</head>
<body>

<!-- ═══ HOME SCREEN ═══ -->
<div class="screen active" id="home">
  <div class="home-header">
    <div class="greeting" id="greeting">నమస్కారం!</div>
  </div>

  <div class="call-card" id="callYodha" onclick="startCall()">
    <svg class="phone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 10.8a19.79 19.79 0 01-3.07-8.68A2 2 0 012 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 14.92z"/>
    </svg>
    <span class="call-label">యోధ</span>
  </div>
</div>

<!-- ═══ ACTIVE CALL SCREEN ═══ -->
<div class="screen" id="call">
  <div class="call-header">
    <div class="call-name">యోధ</div>
    <div class="call-timer" id="callTimer"></div>
  </div>

  <div class="orb-wrap">
    <div class="orb-outer">
      <div class="orb idle" id="orb"></div>
    </div>
  </div>

  <div class="status-label" id="statusLabel">
    <div class="status-dot"></div>
    <span id="statusTxt">సంభాషించడానికి సిద్ధం</span>
  </div>

  <div class="transcript-peek" id="transcriptPeek"></div>

  <div class="call-controls">
    <button class="ctrl-btn" id="muteBtn" onclick="toggleMute()">
      <div class="ctrl-icon">
        <svg id="muteIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
          <path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/>
        </svg>
      </div>
      <span class="ctrl-label">Mute</span>
    </button>

    <button class="ctrl-btn end" onclick="endCall()">
      <div class="ctrl-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.68 13.31a16 16 0 003.41 2.6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-3-2.31M2.07 4.74A19.79 19.79 0 005.14 13.37M1 1l22 22"/>
        </svg>
      </div>
      <span class="ctrl-label">End call</span>
    </button>
  </div>
</div>

<script>
const API = "https://52.140.52.237.nip.io";
let sharedAudio = new Audio();
sharedAudio.playsInline = true;

let active = false, rec = null, chunks = [], history = [], muted = false;
let audioCtx = null, analyser = null, silenceTimer = null, noSpeechTimer = null, monitorRAF = null;
let hasSpoken = false, endedByTimeout = false, userStopped = false;
let timerInterval = null, callSeconds = 0;

/* ── Greeting ── */
(function setGreeting() {
  const h = new Date().getHours();
  const g = h < 12 ? 'శుభోదయం' : h < 17 ? 'శుభ మధ్యాహ్నం' : 'శుభ సాయంత్రం';
  document.getElementById('greeting').textContent = g;
})();

/* ── Screen transitions ── */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startCall() {
  showScreen('call');
  callSeconds = 0;
  updateTimer();
  timerInterval = setInterval(() => { callSeconds++; updateTimer(); }, 1000);
  sharedAudio.play().catch(() => {});
  start();
}

function endCall() {
  clearInterval(timerInterval);
  timerInterval = null;
  callSeconds = 0;
  active = false;
  userStopped = true;
  sharedAudio.pause();
  sharedAudio.currentTime = 0;
  if (rec?.state === 'recording') rec.stop();
  cleanupMonitor();
  history = [];
  setOrb('idle');
  setStatus('', '');
  document.getElementById('transcriptPeek').classList.remove('visible');
  showScreen('home');
}

function updateTimer() {
  const m = Math.floor(callSeconds / 60).toString().padStart(2, '0');
  const s = (callSeconds % 60).toString().padStart(2, '0');
  document.getElementById('callTimer').textContent = `${m}:${s}`;
}

/* ── Mute ── */
function toggleMute() {
  muted = !muted;
  const btn = document.getElementById('muteBtn');
  btn.classList.toggle('muted', muted);
  document.getElementById('muteIcon').innerHTML = muted
    ? `<line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 005.12 2.12M15 9.34V4a3 3 0 00-5.94-.6"/><path d="M17 16.95A7 7 0 015 12v-2m14 0v2a7 7 0 01-.11 1.23M12 19v4M8 23h8"/>`
    : `<path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/>`;
  if (muted && sharedAudio) sharedAudio.pause();
}

/* ── Orb state ── */
function setOrb(state) {
  const orb = document.getElementById('orb');
  orb.className = 'orb ' + (state || 'idle');
}

function setStatus(txt, mode) {
  const sl = document.getElementById('statusLabel');
  const st = document.getElementById('statusTxt');
  sl.className = 'status-label' + (mode ? ' ' + mode : '');
  st.textContent = txt || 'సంభాషించడానికి సిద్ధం';
}

function showTranscript(text) {
  const el = document.getElementById('transcriptPeek');
  if (text) { el.textContent = text; el.classList.add('visible'); }
  else { el.classList.remove('visible'); }
}

/* ── Recording ── */
async function start() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = [];
    hasSpoken = false;
    endedByTimeout = false;
    userStopped = false;
    rec = new MediaRecorder(stream);
    rec.ondataavailable = e => e.data.size > 0 && chunks.push(e.data);
    rec.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      cleanupMonitor();
      if (endedByTimeout || userStopped) {
        chunks = [];
        active = false;
        setOrb('idle');
        setStatus('సంభాషించడానికి సిద్ధం', '');
        return;
      }
      process();
    };
    rec.start(100);
    active = true;
    setOrb('listening');
    setStatus('వింటున్నాను...', 'listening');

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    source.connect(analyser);
    const freqData = new Uint8Array(analyser.frequencyBinCount);

    const SPEECH_THRESHOLD = 25;
    const SILENCE_HOLD_MS = 1500;
    const NO_SPEECH_TIMEOUT_MS = 10000;

    noSpeechTimer = setTimeout(() => {
      if (!hasSpoken) {
        endedByTimeout = true;
        if (rec?.state === 'recording') rec.stop();
      }
    }, NO_SPEECH_TIMEOUT_MS);

    function monitor() {
      if (!analyser) return;
      analyser.getByteFrequencyData(freqData);
      const avg = freqData.reduce((a, b) => a + b, 0) / freqData.length;
      if (avg > SPEECH_THRESHOLD) {
        if (!hasSpoken) { hasSpoken = true; clearTimeout(noSpeechTimer); }
        clearTimeout(silenceTimer);
        silenceTimer = setTimeout(() => {
          if (rec?.state === 'recording') rec.stop();
        }, SILENCE_HOLD_MS);
      }
      monitorRAF = requestAnimationFrame(monitor);
    }
    monitor();
  } catch {
    setStatus('మైక్ అనుమతి అవసరం', '');
  }
}

function cleanupMonitor() {
  if (monitorRAF) cancelAnimationFrame(monitorRAF);
  clearTimeout(silenceTimer);
  clearTimeout(noSpeechTimer);
  if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; }
  analyser = null;
}

async function process() {
  if (!chunks.length) { setOrb('idle'); setStatus('సంభాషించడానికి సిద్ధం', ''); return; }
  setOrb('thinking');
  setStatus('ఆలోచిస్తున్నాను...', 'thinking');

  const blob = new Blob(chunks, { type: 'audio/webm' });
  const b64 = await new Promise(res => {
    const r = new FileReader();
    r.onloadend = () => res(r.result.split(',')[1]);
    r.readAsDataURL(blob);
  });

  try {
    const resp = await fetch(`${API}/converse`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ audio_base64: b64, history })
    });
    const data = await resp.json();
    if (data.transcript) showTranscript(data.transcript);
    if (data.history) history = data.history;
    if (data.audio_base64 && !muted) {
      await playAudio(data.audio_base64);
    } else {
      setOrb('idle');
      setStatus('సంభాషించడానికి సిద్ధం', '');
    }
    if (active && !userStopped) setTimeout(() => start(), 400);
  } catch {
    setStatus('లోపం వచ్చింది — మళ్ళీ ప్రయత్నించండి', '');
    setOrb('idle');
    active = false;
  }
}

function playAudio(b64) {
  return new Promise(res => {
    setOrb('speaking');
    setStatus('జవాబు చెప్తున్నాను...', 'speaking');
    const bytes = atob(b64);
    const buf = new Uint8Array(bytes.length);
    for (let i = 0; i < bytes.length; i++) buf[i] = bytes.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
    sharedAudio.src = url;
    sharedAudio.onended = () => {
      URL.revokeObjectURL(url);
      setOrb('idle');
      setStatus('సంభాషించడానికి సిద్ధం', '');
      res();
    };
    sharedAudio.onerror = () => res();
    sharedAudio.play().catch(() => res());
  });
}
</script>
</body>
</html>
